# --- Database ---
# Prod: QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD from the environment.
# Dev and test: left unset, so Dev Services starts Postgres in Docker.
quarkus.datasource.db-kind=postgresql
# DO's smallest Managed Postgres plans allow ~25 connections; leave room for migrations and psql.
quarkus.datasource.jdbc.max-size=10
# Flyway owns the schema; Hibernate only checks that the entities match it.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# JSON columns (staff_event.changes) use Hibernate's own mapper, not the REST ObjectMapper.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/dev
# Own database name, so a reused Dev Services container from another project is never picked up;
# tests always start from an empty database.
quarkus.datasource.devservices.db-name=finns
%test.quarkus.datasource.devservices.reuse=false

# --- Admin API (/api/v1/admin/*), called only by the Admin Console Worker ---
# No prod default: startup fails without FINNS_ADMIN_API_TOKEN (at least 32 characters).
%dev.finns.admin-api.token=dev-only-token-not-a-secret-0123456789
%test.finns.admin-api.token=test-only-token-not-a-secret-012345678

# --- Gate API (/api/v1/gate/*), called by gate devices ---
# No prod default: startup fails without FINNS_GATE_API_TOKEN (at least 32 characters).
%dev.finns.gate-api.token=dev-only-gate-token-not-a-secret-01234
%test.finns.gate-api.token=test-only-gate-token-not-a-secret-0123

# --- Check-in QR codes ---
finns.qr.ttl=60s

# --- CORS, for the customer app's web build calling /api/v1/app/* directly ---
# Every other API authenticates with a bearer token that browsers never hold, so a global policy is
# harmless for them. FINNS_CORS_ORIGINS overrides the default: the app's Worker, its per-PR preview
# aliases, and any localhost port in dev (flutter run -d chrome picks a random one).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FINNS_CORS_ORIGINS:/https://([a-z0-9-]+-)?trident-app-web[.][a-z0-9-]+[.]workers[.]dev/}
%dev.quarkus.http.cors.origins=/http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?/
%test.quarkus.http.cors.origins=/http://localhost(:[0-9]+)?/
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type

# --- Staff ---
# Made active ADMINs at startup, but only while no active ADMIN exists. Comma-separated.
finns.staff.bootstrap-admins=thomas@nordeast.id
%test.finns.staff.bootstrap-admins=

# The packaged-app smoke tests (*IT) run with the test profile, for its token and Dev Services.
quarkus.test.integration-test-profile=test
