# --- Database ---
# Prod: QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD from the environment.
# Dev and test: left unset, so Dev Services starts Postgres in Docker.
quarkus.datasource.db-kind=postgresql
# DO's smallest Managed Postgres plans allow ~25 connections; leave room for migrations and psql.
quarkus.datasource.jdbc.max-size=10
# Flyway owns the schema; Hibernate only checks that the entities match it.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# JSON columns (staff_event.changes) use Hibernate's own mapper, not the REST ObjectMapper.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/dev
# Own database name, so a reused Dev Services container from another project is never picked up;
# tests always start from an empty database.
quarkus.datasource.devservices.db-name=finns
# Production runs Postgres 18, and the points ledger uses uuidv7(), new in 18.
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
%test.quarkus.datasource.devservices.reuse=false

# --- Admin API (/api/v1/admin/*), called only by the Admin Console Worker ---
# No prod default: startup fails without FINNS_ADMIN_API_TOKEN (at least 32 characters).
%dev.finns.admin-api.token=dev-only-token-not-a-secret-0123456789
%test.finns.admin-api.token=test-only-token-not-a-secret-012345678

# --- Gate API (/api/v1/gate/*), called by gate devices ---
# No prod default: startup fails without FINNS_GATE_API_TOKEN (at least 32 characters).
%dev.finns.gate-api.token=dev-only-gate-token-not-a-secret-01234
%test.finns.gate-api.token=test-only-gate-token-not-a-secret-0123

# --- Booking website (/api/v1/booking/*, and core's calls to it) ---
# No prod defaults: startup fails without FINNS_BOOKING_API_TOKEN and FINNS_BOOKING_REVOKE_TOKEN (at
# least 32 characters, different from each other and from the other tokens) and FINNS_BOOKING_URL, the
# booking website's origin, for example https://booking.example.com.
%dev.finns.booking.api-token=dev-only-booking-token-not-a-secret-01
%dev.finns.booking.revoke-token=dev-only-revoke-token-not-a-secret-01
%dev.finns.booking.url=http://localhost:8787
%test.finns.booking.api-token=test-only-booking-token-not-a-secret-0
%test.finns.booking.revoke-token=test-only-revoke-token-not-a-secret-0
%test.finns.booking.url=http://localhost:9
# How long a handoff code, which signs a customer in to booking, can be redeemed.
finns.booking.handoff-ttl=60s

# --- Points API (/api/v1/points/*), called by points partners (Sota Platforms) server to server ---
# No prod default: startup fails without FINNS_POINTS_API_TOKEN (at least 32 characters, different from
# the other tokens).
%dev.finns.points.api-token=dev-only-points-token-not-a-secret-01
%test.finns.points.api-token=test-only-points-token-not-a-secret-0
# Business dates (reconciliation) are Bali's; the integrity check runs at 02:30 there (18:30 UTC).
finns.points.time-zone=Asia/Makassar
finns.points.check-cron=0 30 18 * * ?
# What core itself credits: 1 point per IDR 10,000 of a paid booking (rounded down), and 10 per granted
# check-in (0 turns it off).
finns.points.earn.booking-idr-per-point=10000
finns.points.earn.check-in=10
# Tests run the check themselves.
%test.quarkus.scheduler.enabled=false

# --- Customer app API (/api/v1/app/*), authenticated with the customer's Keycloak access token ---
# No prod default: startup fails without FINNS_AUTH_ISSUER, the Keycloak realm customers sign in to,
# for example https://test-auth.finnsbeachclub.com/realms/finns. If Keycloak can't be reached at
# startup, core still starts and connects on the first request. (Empty rather than required here only
# so the test profile can leave it unset.)
quarkus.oidc.auth-server-url=${FINNS_AUTH_ISSUER:}
%dev.quarkus.oidc.auth-server-url=https://test-auth.finnsbeachclub.com/realms/finns
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.enabled=false
# Only access tokens (typ Bearer, not ID or refresh tokens) that Keycloak issued to the customer app,
# with a subject.
quarkus.oidc.token.token-type=Bearer
quarkus.oidc.token.required-claims.azp=trident-app
quarkus.oidc.token.subject-required=true
# Tests sign their own tokens with src/test/resources/customer-token-key.pem; this is its public half.
# With a public key, Quarkus also checks the audience when subject-required is set, so the tests skip
# that check (Keycloak access tokens aren't checked for audience either).
%test.quarkus.oidc.token.audience=any
%test.quarkus.oidc.token.issuer=https://auth.test/realms/finns
%test.quarkus.oidc.public-
# Every path under the prefix needs a token, including paths that match no endpoint, checked before
# routing. Not proactive, so the admin and gate APIs' own bearer tokens never reach OIDC.
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.app.paths=/api/v1/app,/api/v1/app/*
quarkus.http.auth.permission.app.policy=authenticated

# --- Keycloak sync: each customer's name and email, copied from their Keycloak account ---
# core's Keycloak extension (keycloak-extension/) posts to /api/v1/keycloak/* with FINNS_KEYCLOAK_WEBHOOK_TOKEN
# (at least 32 characters, different from the other tokens) when a user changes; core then reads the user
# with the client finns-core-sync's service account (FINNS_KEYCLOAK_CLIENT_SECRET; role view-users only).
# No prod defaults: startup fails without them.
finns.keycloak.issuer=${FINNS_AUTH_ISSUER}
%dev.finns.keycloak.issuer=https://test-auth.finnsbeachclub.com/realms/finns
%dev.finns.keycloak.webhook-token=dev-only-keycloak-token-not-a-secret-0
%dev.finns.keycloak.client-secret=${FINNS_KEYCLOAK_CLIENT_SECRET:dev-has-no-secret}
# Off in dev unless a real secret is given, so it doesn't fail every 10 minutes.
%dev.finns.keycloak.reconcile-every=${FINNS_KEYCLOAK_RECONCILE_EVERY:off}
%test.finns.keycloak.issuer=http://localhost:18790/realms/finns
%test.finns.keycloak.webhook-token=test-only-keycloak-token-not-a-secret-0
%test.finns.keycloak.client-secret=test-only-client-secret

# --- Check-in QR codes ---
finns.qr.ttl=60s

# --- CORS, for the customer app's web build calling /api/v1/app/* directly ---
# The admin and gate APIs authenticate with bearer tokens that browsers never hold, so a global policy
# is harmless for them. FINNS_CORS_ORIGINS overrides the default: the app's Worker, its per-PR preview
# aliases, and any localhost port in dev (flutter run -d chrome picks a random one).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FINNS_CORS_ORIGINS:/https://([a-z0-9-]+-)?trident-app-web[.][a-z0-9-]+[.]workers[.]dev/}
%dev.quarkus.http.cors.origins=/http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?/
%test.quarkus.http.cors.origins=/http://localhost(:[0-9]+)?/
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type,Authorization

# --- Staff ---
# Made active ADMINs at startup, but only while no active ADMIN exists. Comma-separated.
finns.staff.bootstrap-admins=thomas@nordeast.id
%test.finns.staff.bootstrap-admins=

# The packaged-app smoke tests (*IT) run with the test profile, for its token and Dev Services.
quarkus.test.integration-test-profile=test
