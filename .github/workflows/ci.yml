## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build native executable
        run: ./mvnw verify -B -Dnative -Dquarkus.native.container-build=true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: src/main/docker/Dockerfile.native-micro

      - name: Build and push image
        id: push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: src/main/docker/Dockerfile.native-micro
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Summarize image
        run: |
          echo "Pushed \`ghcr.io/${{ github.repository }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
